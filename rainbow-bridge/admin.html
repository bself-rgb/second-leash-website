<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rainbow Bridge · Memorial Review</title><style>body{font:16px/1.6 system-ui;background:#f6f0fa;color:#30253e;margin:0}main{max-width:950px;margin:auto;padding:30px 18px}header{background:#302444;color:white;padding:18px}h1{font-size:1.8rem;margin:0}.panel{background:white;border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 3px 14px #24163815}button{background:#65508a;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;margin:5px}button:disabled{opacity:.5}input{padding:12px;border:1px solid #a99ab7;border-radius:8px;max-width:100%;width:300px}article{border-top:1px solid #ddd;padding:20px 0}img{width:150px;height:150px;object-fit:cover;border-radius:10px;margin:5px}p{overflow-wrap:anywhere}.small{font-size:.9rem;color:#655c6b}#notice{white-space:pre-wrap}</style></head><body><header><h1>🌈 Rainbow Bridge · Private Review</h1></header><main><section class="panel"><h2>Administrator sign-in</h2><p>Only authorized Second Leash administrators can access memorial submissions.</p><input id="email" type="email" placeholder="Admin email"><button id="login">Send sign-in link</button><button id="logout" hidden>Sign out</button><p id="account" aria-live="polite"></p></section><section class="panel"><h2>Memorial submissions</h2><button id="refresh">Refresh queue</button><p id="notice" role="status"></p><div id="queue"></div></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://dhtbfnrdinfnqeghwyss.supabase.co','sb_publishable_MUI_dYG5VE1cNqkKyhvXpA_i8pv24qb');
const el=id=>document.getElementById(id),notice=el('notice');
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(payload){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Sign in first');const response=await fetch('https://dhtbfnrdinfnqeghwyss.supabase.co/functions/v1/rb-admin-review',{method:'POST',headers:{'Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_MUI_dYG5VE1cNqkKyhvXpA_i8pv24qb','Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await response.json();if(!response.ok)throw Error(body.error||'Request failed');return body}
async function auth(){const {data:{user}}=await db.auth.getUser();el('account').textContent=user?'Signed in: '+user.email:'Sign in to review memorials';el('logout').hidden=!user;el('login').hidden=!!user}
el('login').onclick=async()=>{const email=el('email').value.trim();if(!email)return;const{error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});el('account').textContent=error?error.message:'Check your email for your sign-in link'};
el('logout').onclick=async()=>{await db.auth.signOut();el('queue').replaceChildren();await auth()};
el('refresh').onclick=load;
async function load(){notice.textContent='Loading…';el('queue').replaceChildren();try{const{memorials}=await call({action:'list'});notice.textContent=memorials.length+' memorial(s) found';for(const m of memorials){const article=document.createElement('article');article.innerHTML='<h3>'+escape(m.pet_name)+' · '+escape(m.status)+'</h3><p class="small">'+escape(m.species)+' · '+escape(m.created_at)+' · '+escape(m.visibility)+'</p><p><strong>Tribute:</strong> '+escape(m.tribute)+'</p><p><strong>Favorite memory:</strong> '+escape(m.favorite_memory)+'</p><div class="photos"></div>';const photos=article.querySelector('.photos');const view=document.createElement('button');view.textContent='View photos';view.onclick=async()=>{try{const data=await call({action:'photos',id:m.id});photos.replaceChildren();for(const p of data.photos){const img=document.createElement('img');img.src=p.url;img.alt='Memorial photo for '+m.pet_name;photos.append(img)}}catch(e){notice.textContent=e.message}};article.append(view);if(m.status==='pending'){for(const [label,status] of [['Approve','approved'],['Request changes','changes_requested'],['Decline','declined']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(!confirm(label+' memorial for '+m.pet_name+'?'))return;b.disabled=true;try{await call({action:'review',id:m.id,status});await load()}catch(e){notice.textContent=e.message;b.disabled=false}};article.append(b)}}el('queue').append(article)}}catch(e){notice.textContent=e.message}}
db.auth.onAuthStateChange(()=>{setTimeout(auth,0)});await auth();
</script></body></html>
